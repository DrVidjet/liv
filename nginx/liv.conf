# Публичный доступ по IP сервера → сервис liv-web на 127.0.0.1:8080
limit_req_zone $binary_remote_addr zone=liv_api:10m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 8k;
    gzip on;
    gzip_types application/json text/css application/javascript;

    # API ходит на food.ru — ограничиваем частоту, чтобы сервер нельзя было использовать для флуда
    location /api/ {
        limit_req zone=liv_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_read_timeout 60s;
    }

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
    }
}
